name: Windows build and tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Check repository contents
        shell: pwsh
        run: ./scripts/Verify-Repository.ps1
      - name: Build, test and publish locally
        shell: pwsh
        run: ./scripts/Build.ps1 -Publish
